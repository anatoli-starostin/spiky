<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Under construction</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 800px at 50% 30%, #1b2233 0%, #0d1017 70%);
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      text-align: center; padding: 1.5rem;
    }
    .card { max-width: 32rem; }
    .badge { font-size: 3rem; line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: 1.7rem; font-weight: 680; letter-spacing: -0.01em; margin: 0 0 0.6rem; }
    p { color: #9fb0c3; font-size: 1.02rem; line-height: 1.6; margin: 0.4rem 0; }
    .rule { width: 3rem; height: 3px; border-radius: 3px; background: #2D5BFF; margin: 1.2rem auto; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚧</div>
    <h1>Under construction</h1>
    <div class="rule"></div>
    <p>This site is temporarily offline while we make some changes.</p>
    <p>Please check back soon.</p>
  </div>
</body>
</html>
